# Local Temporal stack for ta-assistant.
# Ports chosen to avoid the host's existing postgres:17 (5432) and kind (80/443):
#   Postgres -> host 5433   ·   Temporal gRPC -> 7233   ·   Web UI -> http://localhost:8088
# Persistence lives in the named volume `ta_temporal_pgdata` (survives `down`; wiped by `down -v`).
name: ta-temporal

services:
  temporal-postgres:
    image: postgres:16-alpine
    container_name: ta-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5433:5432"
    volumes:
      - ta_temporal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ta-temporal-net]

  temporal:
    image: temporalio/auto-setup:1.29.6
    container_name: ta-temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health 2>&1 | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [ta-temporal-net]

  temporal-ui:
    image: temporalio/ui:2.51.0
    container_name: ta-temporal-ui
    depends_on:
      temporal:
        condition: service_started
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8088
    ports:
      - "8088:8080"
    networks: [ta-temporal-net]

  temporal-admin-tools:
    image: temporalio/admin-tools:1.29.6
    container_name: ta-temporal-admin-tools
    depends_on:
      temporal:
        condition: service_started
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    stdin_open: true
    tty: true
    networks: [ta-temporal-net]

volumes:
  ta_temporal_pgdata:

networks:
  ta-temporal-net:
    driver: bridge
