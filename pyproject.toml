[project]
name = "ta-assistant"
version = "0.0.1"
description = "Local technical-analysis swing-trading decision-support assistant (Temporal-backed)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ---- core (pre-phase durability skeleton) ----
    "temporalio>=1.28,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.7,<3",
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
data = [
    "yfinance>=1.4,<2",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "scipy>=1.13,<2",
    "pandas-market-calendars>=4.4,<6",
    "requests>=2.32,<3",
]
viz = [
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.9,<4",
    "plotly>=6,<7",
]
ui = [
    "streamlit>=1.40,<2",
]
llm = [
    "openai>=1.40,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# We use asyncio (not trio/anyio): ASYNC109 (timeout param) and ASYNC240
# (pathlib in async -> use trio.Path) are not applicable.
ignore = ["ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "mplfinance.*",
    "plotly.*",
    "scipy.*",
    "yfinance.*",
    "pandas_market_calendars.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a Temporal dev server / subprocess workers (deselect with -m 'not integration')",
]
